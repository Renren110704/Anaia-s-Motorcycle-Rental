<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/logo.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Anaia's Motorcycle Rental — search, book and ride." />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo-192.png" />

  <!--
      Fonts: consolidated into ONE request instead of 8 separate
      @import calls scattered across components. `display=swap`
      avoids blocking text render while the font downloads.
      Preconnect warms up the DNS/TLS handshake before the CSS
      request is even discovered.
    -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,700;0,800;1,700;1,800&family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />

  <!--
      LCP image (hero background in HomeBanner.jsx). Preloading it
      here lets the browser start the download immediately while
      parsing <head>, instead of waiting for React to mount and run
      the component before the image request is even discovered.
      Update this path if you rename/move the file — see the note
      in HomeBanner.jsx.
    -->
  <link rel="preload" as="image" href="%PUBLIC_URL%/images/hero-bg.webp" fetchpriority="high" />

  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <title>Anaia's Motorcycle Rental</title>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
</body>

</html>
